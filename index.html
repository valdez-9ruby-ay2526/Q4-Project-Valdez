<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#ececec;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:1100px;
      height:620px;
      background:#f5f5f5;
      display:flex;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.2);
    }

    /* SIDEBAR */

    .header{
      width:220px;
      background:#111827;
      color:white;
      padding:30px 20px;
    }

    .logo{
      text-align:center;
      margin-bottom:40px;
    }

    .logo img{
      width:70px;
    }

    .menu{
      list-style:none;
    }

    .menu li{
      margin:20px 0;
      cursor:pointer;
      transition:.3s;
    }

    .menu li:hover{
      color:#38bdf8;
      padding-left:5px;
    }

    /* MAIN */

    .main{
      flex:1;
      padding:35px;
      position:relative;
      background:linear-gradient(to right,#f8f8f8,#ededed);
    }

    .title{
      background:#111827;
      color:white;
      display:inline-block;
      padding:10px 25px;
      border-radius:12px;
      font-size:28px;
      margin-bottom:10px;
    }

    .subtitle{
      color:gray;
      margin-bottom:40px;
    }

    .profile-wrapper{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    /* LEFT */

    .profile-left{
      width:45%;
      text-align:center;
    }

    .avatar{
      width:130px;
      height:130px;
      border-radius:50%;
      border:5px solid #38bdf8;
      object-fit:cover;
      margin-bottom:20px;
    }

    /* CARD */

    .info-card{
      width:360px;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.15);
    }

    .info-card h2{
      margin-bottom:25px;
      color:#111827;
    }

    .info{
      margin-bottom:20px;
    }

    .label{
      font-size:13px;
      color:gray;
    }

    .value{
      font-weight:600;
      color:#111827;
      margin-top:5px;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#06b6d4;
      color:white;
      cursor:pointer;
      transition:.3s;
      margin-top:10px;
    }

    .btn:hover{
      background:#0891b2;
    }

    .footer{
      position:absolute;
      bottom:15px;
      right:20px;
      font-size:11px;
      color:gray;
    }

    @media(max-width:900px){

      .container{
        flex-direction:column;
        height:auto;
      }

      .sidebar{
        width:100%;
      }

      .profile-wrapper{
        flex-direction:column;
        gap:30px;
      }

      .profile-left,
      .info-card{
        width:100%;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <!-- Header -->

    <div class="header">

      <div class="logo">
        <img src="logoqtr4.webp">
      </div>

      <ul class="menu">
        <li>Dashboard</li>
        <li>Virtual Notebooks</li>
        <li>Tasks</li>
        <li>Profile</li>
        <li>Logout</li>
      </ul>

    </div>

    <!-- Main -->

    <div class="main">

      <div class="title">PROFILE</div>
      <div class="subtitle">Student Information</div>

      <div class="profile-wrapper">

        <!-- LEFT -->

        <div class="profile-left">

          <img class="avatar"
          src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

          <br>

          <input type="file">

        </div>

        <!-- Student Info -->

        <div class="info-card">

          <h2>Student Information</h2>

          <div class="info">
            <div class="label">Student ID</div>
            <div class="value">SN123456</div>
          </div>

          <div class="info">
            <div class="label">Contact Number</div>
            <div class="value">+6312345676767</div>
          </div>

          <div class="info">
            <div class="label">Email Address</div>
            <div class="value">9Ruby@email.com</div>
          </div>

          <div class="info">
            <div class="label">Gender</div>
            <div class="value">Male</div>
          </div>

          <button class="btn">Change Password</button>

        </div>

      </div>

      <div class="footer">
        ICT Q4 PROJECT | 9 Ruby ©2025
      </div>

    </div>

  </div>

</body>
</html>
