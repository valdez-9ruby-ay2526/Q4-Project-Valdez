<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Q4 Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="container" style="max-width: 400px;">
            <div class="card p-4 shadow-lg">
                <!-- Logo space -->
                <div class="text-center mb-3">
                    <img src="logo.png" alt="Logo" class="logo-img" />
                </div>
                <!-- Login Form -->
                <h1 class="text-center mb-4">Login</h1>
                <details ontoggle="alert('TEST CREDENTIALS: \nUser: student067 \nPass: 67890')">
                    <summary class="btn btn-sm btn-outline-secondary mb-3">View Login Help</summary>
                </details>
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" id="usernameInput" name="username" class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" id="passwordInput" name="password" class="form-control" />
                    </div>
                </form>
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <button type="button" class="btn btn-light" id="classifyBtn" onclick="loginUser()">Login</button>
                    <button type="button" class="btn btn-danger" onclick="window.location.reload()">Refresh</button>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
