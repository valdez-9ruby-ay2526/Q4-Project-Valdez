<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#ececec;
    min-height:100vh;
    display:flex;
    justify-content:left;
    align-items:left;
    padding:10px;
}


    background:
    linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
    url('https://www.transparenttextures.com/patterns/geometry.png');

    border-radius:12px;
    padding:50px;

    display:flex;
    justify-content:space-between;
    align-items:left;
    gap:50px;

    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

/* LEFT SIDE */
.left-section{
    flex:1;
}

.profile-title{
    background:#1f2940;
    color:#fff;

    display:inline-block;

    padding:12px 24px;

    border-radius:10px;

    font-size:28px;
    font-weight:600;

    margin-bottom:20px;
}

.subtitle{
    color:#555;
    margin-bottom:40px;
    font-size:15px;
}

/* PROFILE IMAGE */
.profile-image{
    width:180px;
    height:180px;

    border-radius:50%;
    object-fit:cover;

    display:block;

    margin-bottom:25px;
}

/* FILE INPUT */
input[type="file"]{
    font-size:14px;
}

/* RIGHT CARD */
.info-card{
    width:340px;

    background:#f8f8f8;

    padding:35px;

    border-radius:15px;

    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

.info-card h2{
    font-size:42px;
    line-height:1.1;

    color:#1a1a1a;

    margin-bottom:35px;
}

.info-group{
    margin-bottom:22px;
}

.label{
    color:#777;
    font-size:13px;

    margin-bottom:5px;
}

.value{
    color:#111;
    font-weight:600;
    font-size:15px;
}

/* BUTTON */
.change-btn{
    width:100%;

    padding:14px;

    border:none;

    background:#20b8d8;
    color:white;

    border-radius:7px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    margin-top:15px;
}

.change-btn:hover{
    background:#1698b3;
}

/* RESPONSIVE */
@media(max-width:900px){

    .container{
        flex-direction:column;
        padding:30px;
        text-align:center;
    }

    .info-card{
        width:100%;
        max-width:400px;
    }

    .profile-image{
        margin:auto auto 25px;
    }
}

</style>
</head>

<body>

   <div class="d-flex align-text-streched">

     <!--Column 1-->
    <div class="bg-dark text-white p-4">
        <img src="logo.png" width="200px">
        <ul class="nav flex-column">
            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li>
                <a href="notebook.html">Virtual Notebooks</a>
            </li>
            <li>
                <a href="profile.html">Profile</a>
            </li>
            <li>
                <a href="tasks.html">Task</a>
            </li>
            <li>
                <a href="index.html">Logout</a>
            </li>
        </ul>
    </div>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-section">

        <div class="profile-title">
            PROFILE
        </div>

        <p class="subtitle">
            Student Information.
        </p>

        <img
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        alt="Profile"
        class="profile-image">

        <input type="file">

    </div>

    <!-- RIGHT SIDE -->
    <div class="info-card">

        <h2>
            Student Information
        </h2>

        <div class="info-group">
            <div class="label">Student ID</div>
            <div class="value">SN123456</div>
        </div>

        <div class="info-group">
            <div class="label">Contact Number</div>
            <div class="value">+639150000001</div>
        </div>

        <div class="info-group">
            <div class="label">Email Address</div>
            <div class="value">
                delacruz.jr@bmontessori.edu.ph
            </div>
        </div>

        <div class="info-group">
            <div class="label">Gender</div>
            <div class="value">Male</div>
        </div>

        <button class="change-btn">
            Change Password
        </button>

    </div>

</div>

</body>
</html>
