<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#e9e9e9;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:1200px;
      min-height:700px;

      background:
      linear-gradient(rgba(255,255,255,0.85),
      rgba(255,255,255,0.85)),
      url('https://www.transparenttextures.com/patterns/cubes.png');

      background-size:cover;
      border-radius:15px;
      padding:40px;
      position:relative;

      display:flex;
      justify-content:space-between;
      align-items:center;

      box-shadow:0 5px 20px rgba(0,0,0,0.2);
    }

    /* LEFT SIDE */

    .left-section{
      width:45%;
    }

    .profile-title{
      background:#1f2533;
      color:white;
      display:inline-block;
      padding:12px 25px;
      border-radius:12px;
      font-size:35px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .subtitle{
      color:#555;
      margin-bottom:40px;
    }

    .profile-pic{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .profile-pic img{
      width:170px;
      height:170px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:15px;
    }

    /* RIGHT CARD */

    .info-card{
      width:350px;
      background:white;
      border-radius:15px;
      padding:30px;

      box-shadow:0 5px 15px rgba(0,0,0,0.15);
    }

    .info-card h2{
      font-size:35px;
      color:#222;
      margin-bottom:35px;
      line-height:1.1;
    }

    .info{
      margin-bottom:25px;
    }

    .info label{
      display:block;
      color:gray;
      font-size:13px;
      margin-bottom:5px;
    }

    .info p{
      color:#222;
      font-weight:bold;
      font-size:15px;
    }

    .btn{
      width:100%;
      padding:13px;
      border:none;
      border-radius:7px;
      background:#13b8dc;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#0f9cbc;
    }

    /* RESPONSIVE */

    @media(max-width:900px){

      .container{
        flex-direction:column;
        gap:40px;
        text-align:center;
      }

      .left-section{
        width:100%;
      }

      .info-card{
        width:100%;
        max-width:400px;
      }
    }

  </style>
</head>

<body>
     <div class="d-flex align-text-streched">

     <!--Column 1-->
    <div class="bg-dark text-white p-4">
        <img src="1000027625.png" width="200px">

            <li>

            </li>
            <li>
                <a href="">Task</a>
            </li>
            <li>
                <a href="index.html">Logout</a>
            </li>
        </ul>
    </div>


  <div class="container">

    <!-- LEFT SECTION -->

    <div class="left-section">

      <div class="profile-title">
        PROFILE
      </div>

      <p class="subtitle">
        Student Information.
      </p>

      <div class="profile-pic">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

        <input type="file">
      </div>

    </div>

    <!-- RIGHT SECTION -->

    <div class="info-card">

      <h2>Student Information</h2>

      <div class="info">
        <label>Student ID</label>
        <p>SN123456</p>
      </div>

      <div class="info">
        <label>Contact Number</label>
        <p>+639150000001</p>
      </div>

      <div class="info">
        <label>Email Address</label>
        <p>delacruz.jr@obmontessori.edu.ph</p>
      </div>

      <div class="info">
        <label>Gender</label>
        <p>Male</p>
      </div>

      <button class="btn">
        Change Password
      </button>

    </div>

  </div>

</body>
</html>
