    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

 <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#ececec;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .profile-container{
      width:350px;
      background:white;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }


    .upload-section{
      padding:15px 20px 0;
    }

    .profile-content{
      padding:20px;
    }

    .profile-content h1{
      font-size:38px;
      color:#0d1b4c;
      margin-bottom:25px;
      line-height:1;
    }

    .info{
      margin-bottom:18px;
    }

    .info label{
      display:block;
      font-size:12px;
      color:#777;
      margin-bottom:5px;
    }

    .info p{
      font-weight:bold;
      color:#111;
      font-size:15px;
    }

    .btn{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#10b4d4;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#0c9ab6;
    }
  </style>
</head>

<body>

  
     <div class="d-flex align-text-streched">

     <!--Column 1-->

  <div class="profile-container">

    <div class="profile-header">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
    </div>

    <div class="upload-section">
      <input type="file">
    </div>

    <div class="profile-content">
      <h1>Student<br>Information</h1>

      <div class="info">
        <label>Student ID</label>
        <p>SN123456</p>
      </div>

      <div class="info">
        <label>Contact Number</label>
        <p>+6312345676767</p>
      </div>

      <div class="info">
        <label>Email Address</label>
        <p>9Ruby@email.com</p>
      </div>

      <div class="info">
        <label>Gender</label>
        <p>Male</p>
      </div>

      <button class="btn">Change Password</button>
    </div>

  </div>

</body>
