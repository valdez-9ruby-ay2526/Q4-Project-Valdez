<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#e9e9e9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

    .container{
      width:850px;
      background:#ffffff;
      border-radius:12px;
      padding:40px;
      display:flex;
      justify-content:space-between;
      gap:40px;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    /* LEFT SECTION */
    .left-section{
      flex:1;
    }

    .profile-title{
      background:#1f2940;
      color:#fff;
      display:inline-block;
      padding:12px 20px;
      border-radius:10px;
      font-size:20px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .subtitle{
      margin-bottom:30px;
      color:#555;
      font-size:14px;
    }

    .profile-image{
      width:160px;
      height:160px;
      border-radius:50%;
      object-fit:cover;
      display:block;
      margin-bottom:20px;
    }

    input[type="file"]{
      font-size:14px;
    }

    /* RIGHT SECTION */
    .info-card{
      width:320px;
      background:#f7f7f7;
      padding:25px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .info-card h2{
      font-size:36px;
      line-height:1.1;
      margin-bottom:25px;
      color:#222;
    }

    .info-group{
      margin-bottom:18px;
    }

    .label{
      font-size:12px;
      color:#777;
      margin-bottom:5px;
    }

    .value{
      font-size:14px;
      font-weight:bold;
      color:#111;
    }

    .change-btn{
      width:100%;
      padding:12px;
      border:none;
      background:#20b8d8;
      color:#fff;
      border-radius:6px;
      font-weight:bold;
      cursor:pointer;
      margin-top:15px;
    }

    .change-btn:hover{
      background:#1698b3;
    }

  </style>
</head>
<body>
   <div class="d-flex align-text-streched">

     <!--Column 1-->
    <div class="bg-dark text-white p-4">
        <img src="1000027625.png" width="200px">
        <ul class="nav flex-column">
            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li>
                <a href="notebook.html">Virtual Notebooks</a>
            </li>
            <li>
                <a href="profile.html">Profile</a>
            </li>
            <li>
                <a href="tasks.html">Task</a>
            </li>
            <li>
                <a href="index.html">Logout</a>
            </li>
        </ul>
    </div>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left-section">

      <div class="profile-title">
        PROFILE
      </div>

      <p class="subtitle">Student Information.</p>

      <img
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        alt="Profile"
        class="profile-image"
      >

      <input type="file">

    </div>

    <!-- RIGHT SIDE -->
    <div class="info-card">

      <h2>
        Student<br>
        Information
      </h2>

      <div class="info-group">
        <div class="label">Student ID</div>
        <div class="value">SN123456</div>
      </div>

      <div class="info-group">
        <div class="label">Contact Number</div>
        <div class="value">+639150000001</div>
      </div>

      <div class="info-group">
        <div class="label">Email Address</div>
        <div class="value">delacruz.jr@bmontessori.edu.ph</div>
      </div>

      <div class="info-group">
        <div class="label">Gender</div>
        <div class="value">Male</div>
      </div>

      <button class="change-btn">
        Change Password
      </button>

    </div>

  </div>

</body>
</html>
